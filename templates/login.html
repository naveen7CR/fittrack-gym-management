{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login">
  <h1>FitTrack</h1>
  <p class="sub">Sign in to manage the gym.</p>
  <form method="post">
    <label>Username</label><input name="username" autofocus required>
    <label>Password</label><input name="password" type="password" required>
    <p><button class="btn" style="width:100%;margin-top:14px">Sign in</button></p>
  </form>
  <p class="hint">Demo login: admin / admin123</p>
</div>
{% endblock %}
